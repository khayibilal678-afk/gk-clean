<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Planning Ménage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une seule colonne centrée, onglets simples, listes lisibles. Propriétés logiques pour passer de gauche-droite à droite-gauche. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --field: #f7f9fb;
  --fg: #16212b;
  --muted: #5b6b79;
  --line: #dbe2e8;
  --accent: #0a6a86;
  --accent-fg: #ffffff;
  --accent-soft: #e0f1f6;
  --warn: #9a4a00;
  --warn-soft: #fdebcf;
  --ok: #17703f;
  --ok-soft: #e0f4e8;
  --danger: #b3261e;
  --chip-bg-l: 92%;
  --chip-fg-l: 24%;
  --font: "Public Sans", "Noto Sans Arabic", "Segoe UI", system-ui, -apple-system, Tahoma, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151b;
    --surface: #16212a;
    --field: #101a21;
    --fg: #e7eef4;
    --muted: #93a4b3;
    --line: #2a3844;
    --accent: #4cc0de;
    --accent-fg: #052330;
    --accent-soft: #13313c;
    --warn: #f1b560;
    --warn-soft: #3a2a10;
    --ok: #66d598;
    --ok-soft: #12321f;
    --danger: #ff8c80;
    --chip-bg-l: 22%;
    --chip-fg-l: 84%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151b;
  --surface: #16212a;
  --field: #101a21;
  --fg: #e7eef4;
  --muted: #93a4b3;
  --line: #2a3844;
  --accent: #4cc0de;
  --accent-fg: #052330;
  --accent-soft: #13313c;
  --warn: #f1b560;
  --warn-soft: #3a2a10;
  --ok: #66d598;
  --ok-soft: #12321f;
  --danger: #ff8c80;
  --chip-bg-l: 22%;
  --chip-fg-l: 84%;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 20px 56px;
}
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-size: 1.5rem; font-weight: 700; }
h2 { font-size: 1.2rem; font-weight: 600; }
h3 { font-size: 1.02rem; font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hint { color: var(--muted); font-size: 0.88rem; margin: 0; }
.num { direction: ltr; unicode-bidi: isolate; display: inline-block; font-variant-numeric: tabular-nums; }
input[type="number"], input[type="time"], input[type="date"] { direction: ltr; }
[dir="rtl"] .ic-dir { transform: scaleX(-1); }

.app { max-width: 56rem; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }

/* Onglets */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 12px 16px; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }

/* Boutons et champs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.armed { background: var(--danger); color: #fff; }
.btn.small { min-height: 36px; padding: 5px 12px; font-size: 0.9rem; }
.btn.block { width: 100%; }
.btn svg { width: 16px; height: 16px; flex: none; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 4px 2px; font-size: 0.88rem; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
select, input[type="text"], input[type="search"], input[type="password"], input[type="number"], input[type="date"], input[type="time"] { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-height: 42px; width: 100%; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; justify-content: space-between; }
.grp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.bar select, .bar input[type="search"] { width: auto; max-width: 100%; }
.bar input[type="search"] { min-width: 13rem; }
.period { font-weight: 600; font-size: 1.1rem; padding-inline: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

/* Résumé */
.sum { display: flex; flex-wrap: wrap; gap: 6px 28px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.sum div { display: flex; flex-direction: column; min-width: 0; }
.sum b { font-size: 1.2rem; font-weight: 600; }
.sum span { color: var(--muted); font-size: 0.82rem; }
.sum .bad b { color: var(--warn); }

/* Pour commencer */
.start ol { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.start li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
.start li span { flex: 1 1 16rem; }
.start li.ok span { color: var(--muted); text-decoration: line-through; }

/* Jours */
.days { display: flex; flex-direction: column; gap: 22px; }
.day { display: flex; flex-direction: column; gap: 8px; }
.day-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.day-h h3::first-letter { text-transform: uppercase; }
.day-h .tot { margin-inline-start: auto; color: var(--muted); font-size: 0.88rem; }
.day.today .day-h { border-bottom: 2px solid var(--accent); }
.badge { font-size: 0.72rem; background: var(--accent); color: var(--accent-fg); border-radius: 4px; padding: 2px 7px; font-weight: 600; }
.empty { color: var(--muted); margin: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.add-link { border: 0; background: none; color: var(--accent); padding: 4px 0; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

/* Mission */
.mission { display: grid; grid-template-columns: 4.4rem minmax(0, 1fr) auto; gap: 6px 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.when { display: flex; flex-direction: column; line-height: 1.35; font-weight: 600; }
.when .end { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
.body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.body strong { font-weight: 600; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 0.88rem; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.9rem; margin-top: 2px; }
.chip { display: inline-flex; align-items: center; padding: 1px 10px; border-radius: 999px; font-weight: 600; font-size: 0.84rem; background: hsl(var(--h) 55% var(--chip-bg-l)); color: hsl(var(--h) 55% var(--chip-fg-l)); }
.extra { color: var(--warn); font-weight: 500; }
.note { color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
.alerts { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
.alert { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 3px 8px; font-size: 0.84rem; font-weight: 500; width: fit-content; max-width: 100%; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.mission.done { background: var(--ok-soft); border-color: transparent; }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
@media (max-width: 600px) {
  .mission { grid-template-columns: 4rem minmax(0, 1fr); }
  .acts { grid-column: 2; justify-content: flex-start; }
}

/* Maisons et équipe */
.stack { display: flex; flex-direction: column; gap: 22px; }
.cgroup { display: flex; flex-direction: column; gap: 8px; }
.cgroup-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.cgroup-h span { margin-inline-start: auto; color: var(--muted); font-size: 0.88rem; }
.svc { display: inline-flex; align-items: center; font-size: 0.78rem; font-weight: 600; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.svt { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.svt[hidden] { display: none; }
.svt input[type="number"] { width: 6.5rem; flex: none; }
.svgrid { display: flex; flex-direction: column; gap: 6px; }
.svrow { display: flex; gap: 8px; align-items: center; }
.svrow input[type="text"] { flex: 1; width: auto; min-width: 0; }
.subh { margin-top: 18px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.row .name { font-weight: 600; overflow-wrap: anywhere; }
.row .facts { display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: center; margin-top: 2px; }
.row .who { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.wcard .row { border: 0; }
.wcard details { border-top: 1px solid var(--line); }
.wcard summary { padding: 11px 14px; cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.wcard summary .sub { margin-inline-start: auto; }
.wcard .wl { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 6px; }
.wcard .wl p { margin: 0; font-size: 0.92rem; overflow-wrap: anywhere; }

/* Heures */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 11px 14px; text-align: end; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child, .txt { text-align: start; }
thead th { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
tbody th { font-weight: 400; }
tfoot td, tfoot th { font-weight: 600; border-bottom: 0; background: var(--field); }
details.det { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
details.det + details.det { margin-top: 8px; }
details.det > summary { padding: 12px 14px; cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
details.det > summary .tot { margin-inline-start: auto; font-weight: 600; }
details.det .tablewrap { border: 0; border-top: 1px solid var(--line); border-radius: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 16px; min-height: 40px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

/* Dialogue */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 0; width: min(36rem, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
dialog::backdrop { background: rgba(5, 12, 18, 0.55); }
.dlg { display: flex; flex-direction: column; gap: 16px; padding: 20px; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > label, .fld > .lab { font-size: 0.88rem; font-weight: 600; }
.fld small { color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline input[type="number"] { width: 6.5rem; }
.preview { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 0.94rem; }
.err { color: var(--danger); margin: 0; font-weight: 500; }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.assign { max-height: 42vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 12px; background: var(--field); }
.cityg { display: flex; flex-direction: column; gap: 2px; }
.cityh { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 6px 2px; min-height: 42px; cursor: pointer; }
.chk input, .chkrow input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
.chk span { display: flex; flex-direction: column; min-width: 0; }
.chk b { font-weight: 600; overflow-wrap: anywhere; }
.chk small { color: var(--muted); overflow-wrap: anywhere; }
.chk[hidden], .cityg[hidden] { display: none; }
.chkrow { display: flex; gap: 10px; align-items: center; cursor: pointer; min-height: 38px; }
.sec { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.sec:first-of-type { border-top: 0; padding-top: 0; }
@media (max-width: 440px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

/* Connexion */
.authbox { max-width: 24rem; margin: 6vh auto 0; display: flex; flex-direction: column; gap: 18px; }
.authbox .langrow { display: flex; justify-content: flex-end; }
.form { display: flex; flex-direction: column; gap: 14px; }
details.forgot { color: var(--muted); font-size: 0.92rem; }
details.forgot summary { cursor: pointer; }
details.forgot p { margin: 8px 0; }

/* Facture et impression */
dialog.wide { width: min(54rem, calc(100vw - 24px)); }
.invprev { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; }
.printonly, #printzone { display: none; }
@page { margin: 14mm; }
@media print {
  :root:root:root {
    --bg: #fff; --surface: #fff; --field: #fff; --fg: #000; --muted: #444; --line: #bbb; --accent: #000; --accent-fg: #fff; --accent-soft: #eee;
    --warn: #000; --warn-soft: #eee; --ok: #000; --ok-soft: #fff; --chip-bg-l: 92%; --chip-fg-l: 20%;
  }
  body { background: #fff; color: #000; padding: 0; font-size: 12pt; }
  .top, .tabs, .bar, .acts, .add-link, .start, dialog, #toast { display: none !important; }
  .printonly { display: block; margin-bottom: 10px; }
  .app { max-width: none; gap: 12px; }
  .mission, .row, .sum, .tablewrap, .day { break-inside: avoid; }
  body.pz #app, body.pz #auth { display: none !important; }
  body.pz #printzone { display: block; }
}

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 0.92rem; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 20; max-width: calc(100vw - 32px); }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>


<div id="auth" hidden></div>
<div id="app" class="app" hidden>
  <header class="top">
    <h1 id="h-name"></h1>
    <div class="tools">
      <button id="b-lang" class="btn small" data-act="lang" type="button"></button>
      <button id="b-set" class="btn small" data-act="settings" type="button"></button>
      <button id="b-out" class="btn small" data-act="logout" type="button"></button>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<datalist id="cities"></datalist>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printzone"></div>

      case "hp-month": ui.hPeriod = "month"; render(); break;
      case "h-prev": { const a = parse(ui.hAnchor); ui.hAnchor = iso(ui.hPeriod === "month" ? new Date(a.getFullYear(), a.getMonth() - 1, 1) : addDays(a, -7)); render(); break; }
      case "h-next": { const a = parse(ui.hAnchor); ui.hAnchor = iso(ui.hPeriod === "month" ? new Date(a.getFullYear(), a.getMonth() + 1, 1) : addDays(a, 7)); render(); break; }
      case "h-today": ui.hAnchor = iso(today()); render(); break;
      case "print": printPage(); break;
      case "export": exportXlsx(b.dataset.from, b.dataset.to); break;
      case "export-all": exportAll(); break;
      case "del-service": if (state.services.length > 1) { state.services = state.services.filter((s) => s.id !== id); save(); openDlg(settingsView()); render(); } break;
      case "sv-restore": DEFAULT_SV.forEach((k) => { if (!svOf(k)) state.services.push({ id: k, nom: "" }); }); save(); openDlg(settingsView()); render(); break;
      case "invoice": openDlg(invoiceDialog(id), true); refreshInvoice(); break;
      case "inv-print": invoiceAction("print"); break;
      case "inv-html": invoiceAction("html"); break;
      case "inv-xlsx": invoiceAction("xlsx"); break;
      case "export-backup": download("planning-menage-sauvegarde-" + iso(today()) + ".json", JSON.stringify({ app: "planning-menage", v: 3, workers: state.workers, houses: state.houses, missions: state.missions, services: state.services, settings: state.settings }, null, 1), "application/json").then((ok) => { if (ok) toast(t("backupSaved")); }); break;
      case "do-import": if (pendingImport) { state = pendingImport; pendingImport = null; save(); closeDlg(); toast(t("importDone")); render(); } break;
    }
  });
  document.addEventListener("change", (ev) => {
    const tg = ev.target;
    if (tg.id === "imp-file") { readBackup(tg.files && tg.files[0]); return; }
    if (tg.closest && tg.closest('form[data-form="invoice"]')) { refreshInvoice(tg.name === "houseId"); return; }
    if (tg.dataset && tg.dataset.change === "filter-worker") { ui.worker = tg.value; render(); return; }
    if (tg.id === "f-city") { ui.city = tg.value; renderHouseList(); return; }
    if (tg.closest && tg.closest('form[data-form="mission"]')) {
      if (tg.name === "workerId" || tg.name === "showAll") { if (refreshHouseSelect()) applyHouseDefaults(); }
      else if (tg.name === "houseId") applyHouseDefaults();
      else if (tg.name === "service") applyServiceDefaults();
      updatePreview(); return;
    }
    if (tg.name === "service" && tg.closest && tg.closest('form[data-form="house"]')) { dlg.querySelectorAll(".svt").forEach((r) => { r.hidden = r.dataset.sv === tg.value; }); return; }
    if (tg.name === "maisons") updateCount();
  });
  document.addEventListener("input", (ev) => {
    const tg = ev.target;
    if (tg.id === "f-search") { ui.q = tg.value; renderHouseList(); return; }
    if (tg.id === "e-search") { filterChecklist(tg); return; }
    if (tg.closest && tg.closest('form[data-form="invoice"]')) { refreshInvoice(false); return; }
    if (tg.closest && tg.closest('form[data-form="mission"]')) updatePreview();
  });
  document.addEventListener("submit", (ev) => {
    const f = ev.target.closest("form[data-form]"); if (!f) return;
    ev.preventDefault();
    const k = f.dataset.form;
    if (k === "mission") saveMission(f);
    else if (k === "house") saveHouse(f, !!(ev.submitter && ev.submitter.dataset.again));
    else if (k === "worker") saveWorker(f);
    else if (k === "pwd") changePwd(f);
    else if (k === "company") saveCompany(f);
    else if (k === "services") saveServices(f);
    else if (k === "invoice") return;
    else if (k === "setup") doSetup(f);
    else if (k === "login") doLogin(f);
  });

  /* ---------- Démarrage ---------- */
  makeFormatters();
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  try { if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  if (isSignedIn()) enterApp(); else showAuth();
})();
</script>
